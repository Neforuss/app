name: Sync X-Posed data

# Keeps the bundled copy of X-Posed's country data (and the parity test
# vectors) in step with github.com/xaitax/x-account-location-device. Runs
# weekly; when X-Posed changed anything the app uses, opens a pull request.
# The AboutAccountQuery ID is additionally refreshed by the app itself at
# runtime (NFBCountryStore -refreshQueryIDForce:), so an ID rotation does not
# wait for this job.
#
# One-time repository setup:
#  - Forks: enable scheduled workflows once in the Actions tab.
#  - Settings > Actions > General > "Allow GitHub Actions to create and
#    approve pull requests" must be on for the PR step.
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so this job
# dispatches "Custom tweak checks" on the sync branch itself.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Fetch X-Posed
        run: git clone --depth 1 https://github.com/xaitax/x-account-location-device "$RUNNER_TEMP/xposed"

      - name: Regenerate data
        id: sync
        run: |
          node tools/xposed-sync/sync.mjs "$RUNNER_TEMP/xposed" | tee "$RUNNER_TEMP/sync.log"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One branch, updated in place: a second week of changes refreshes
          # the open PR instead of opening another.
          BRANCH="xposed-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A layout tests/fixtures
          git commit -m "Sync X-Posed country data" -m "$(tail -n1 "$RUNNER_TEMP/sync.log")"
          git push --force -u origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --title "Sync X-Posed country data" \
              --body "Regenerated by tools/xposed-sync/sync.mjs. $(tail -n1 "$RUNNER_TEMP/sync.log"). Custom tweak checks are dispatched on this branch to re-run the X-Posed parity tests."
          fi
          gh workflow run custom-checks.yml --ref "$BRANCH"
