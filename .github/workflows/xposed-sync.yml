name: Sync X-Posed data

# Keeps the bundled copy of X-Posed's country data (and the parity test
# vectors) in step with github.com/xaitax/x-account-location-device. Runs
# weekly; when X-Posed changed anything the app uses, opens a pull request.
# The AboutAccountQuery ID is additionally refreshed by the app itself at
# runtime (NFBCountryStore -refreshQueryIDForce:), so an ID rotation does not
# wait for this job.
#
# Note: GitHub disables scheduled workflows in forks until they are enabled
# once in the repository's Actions tab.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Fetch X-Posed
        run: git clone --depth 1 https://github.com/xaitax/x-account-location-device "$RUNNER_TEMP/xposed"

      - name: Regenerate data
        id: sync
        run: |
          node tools/xposed-sync/sync.mjs "$RUNNER_TEMP/xposed" | tee "$RUNNER_TEMP/sync.log"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="xposed-sync/$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A layout tests/fixtures
          git commit -m "Sync X-Posed country data" -m "$(tail -n1 "$RUNNER_TEMP/sync.log")"
          git push -u origin "$BRANCH"
          gh pr create --title "Sync X-Posed country data" \
            --body "Regenerated by tools/xposed-sync/sync.mjs. $(tail -n1 "$RUNNER_TEMP/sync.log"). The Custom tweak checks workflow re-runs the parity tests against the new vectors."
